<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noise vs data distributions</title>
<link rel="stylesheet" href="/style.css">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: var(--bg); color: var(--fg); }
  body { padding: 0.5rem 0.75rem; box-sizing: border-box; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .col { min-width: 0; }
  .label { font-size: 13px; color: var(--muted); margin: 0 0 6px; font-weight: 500; }
  .caption { font-size: 13px; color: var(--muted); margin: 0.5rem 0 0; }
  canvas { width: 100%; height: auto; aspect-ratio: 1 / 1; border: 1px solid var(--rule); border-radius: 4px; display: block; background: var(--bg); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<h2 class="sr-only">Scatter plot showing Gaussian noise samples and two-moons data samples side by side</h2>
<div class="grid">
  <div class="col">
    <p class="label">Noise distribution (easy to sample)</p>
    <canvas id="noiseCanvas" width="300" height="300"></canvas>
  </div>
  <div class="col">
    <p class="label">Data distribution (what we want to generate)</p>
    <canvas id="dataCanvas" width="300" height="300"></canvas>
  </div>
</div>
<p class="caption">The fundamental question: how do we build a map from the left to the right?</p>
<script>
  const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  function drawPoints(canvasId, points, color) {
    const canvas = document.getElementById(canvasId);
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = cssVar('--bg') || '#faf3e0';
    ctx.fillRect(0, 0, w, h);
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = color;
    points.forEach(([x, y]) => {
      const px = (x + 3) / 6 * w;
      const py = (1 - (y + 3) / 6) * h;
      ctx.beginPath();
      ctx.arc(px, py, 2.5, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  function randn() {
    let u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  const noise = [];
  for (let i = 0; i < 500; i++) noise.push([randn(), randn()]);

  const moons = [];
  for (let i = 0; i < 250; i++) {
    const a = Math.PI * Math.random();
    moons.push([Math.cos(a) + 0.1 * randn(), Math.sin(a) + 0.1 * randn()]);
  }
  for (let i = 0; i < 250; i++) {
    const a = Math.PI * Math.random();
    moons.push([1 - Math.cos(a) + 0.1 * randn(), 1 - Math.sin(a) - 0.5 + 0.1 * randn()]);
  }

  function redraw() {
    drawPoints('noiseCanvas', noise, '#534AB7');
    drawPoints('dataCanvas', moons, '#1D9E75');
  }

  redraw();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', redraw);

  function postHeight() {
    parent.postMessage({type: 'viz-height', height: document.body.scrollHeight}, '*');
  }
  window.addEventListener('load', postHeight);
  new ResizeObserver(postHeight).observe(document.body);
</script>
</body>
</html>
