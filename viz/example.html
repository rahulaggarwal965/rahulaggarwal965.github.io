<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>example viz</title>
<link rel="stylesheet" href="/style.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); }
  body { display: flex; flex-direction: column; }
  .controls {
    padding: 8px 12px;
    border-bottom: 1px solid var(--rule);
    font-size: 14px;
    display: flex;
    gap: 16px;
    align-items: center;
    color: var(--muted);
  }
  .controls input[type=range] { vertical-align: middle; accent-color: var(--link); }
  canvas { display: block; flex: 1; width: 100%; }
</style>
</head>
<body>
<div class="controls">
  <label>Frequency: <input id="freq" type="range" min="1" max="20" step="0.1" value="5"></label>
  <span id="freqVal">5.0</span>
  <label>Amplitude: <input id="amp" type="range" min="0.1" max="1" step="0.05" value="0.8"></label>
  <span id="ampVal">0.80</span>
</div>
<canvas id="c"></canvas>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const freq = document.getElementById('freq');
  const amp = document.getElementById('amp');
  const freqVal = document.getElementById('freqVal');
  const ampVal = document.getElementById('ampVal');
  const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = canvas.clientWidth * dpr;
    canvas.height = canvas.clientHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function draw() {
    const f = parseFloat(freq.value);
    const a = parseFloat(amp.value);
    freqVal.textContent = f.toFixed(1);
    ampVal.textContent = a.toFixed(2);
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = cssVar('--link') || '#6b3f20';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let x = 0; x <= w; x++) {
      const t = (x / w) * Math.PI * 2 * f;
      const y = h / 2 + Math.sin(t) * (h / 2) * a;
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  freq.addEventListener('input', draw);
  amp.addEventListener('input', draw);
  window.addEventListener('resize', resize);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
  resize();
</script>
</body>
</html>
